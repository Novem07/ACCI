name: ACCI quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      DB_SERVER: localhost
      DB_PORT: 1433
      DB_NAME: ACCI_CI_SMOKE
      DB_USER: sa
      DB_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
      DB_ENCRYPT: false
      DB_TRUST_SERVER_CERTIFICATE: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install sqlcmd
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl apt-transport-https
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..60}; do
            if sqlcmd -S "$DB_SERVER" -U "$DB_USER" -P "$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready" >&2
          exit 1

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npm run db:smoke
