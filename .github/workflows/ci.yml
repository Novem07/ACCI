name: ACCI quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      DB_SERVER: localhost
      DB_PORT: 1433
      DB_NAME: ACCI_CI_SMOKE
      DB_USER: sa
      DB_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
      DB_ENCRYPT: false
      DB_TRUST_SERVER_CERTIFICATE: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate CI database secret
        shell: bash
        env:
          CI_SQL_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_SQL_PASSWORD" ]]; then
            echo "CI_SQL_PASSWORD repository secret is required for the SQL Server service." >&2
            exit 1
          fi

      - name: Install sqlcmd
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          curl -fsSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..60}; do
            if sqlcmd -S "$DB_SERVER" -U "$DB_USER" -P "$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready" >&2
          exit 1

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npm run db:smoke
